<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LimaTrack — Seguimiento en tiempo real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg:    #0b0d12;
      --bg2:   #111520;
      --bg3:   #181c2a;
      --bg4:   #1e2335;
      --bg5:   #252b3d;
      --b:     rgba(255,255,255,0.06);
      --b2:    rgba(255,255,255,0.12);
      --b3:    rgba(255,255,255,0.20);
      --t:     #eceef5;
      --t2:    #8b91a8;
      --t3:    #4a5068;

      --blue:   #4d9cf8;
      --blue-s: rgba(77,156,248,0.12);
      --blue-b: rgba(77,156,248,0.25);
      --blue-g: rgba(77,156,248,0.06);

      --green:   #33d492;
      --green-s: rgba(51,212,146,0.12);
      --green-b: rgba(51,212,146,0.25);

      --amber:   #f8b84d;
      --amber-s: rgba(248,184,77,0.12);
      --amber-b: rgba(248,184,77,0.25);

      --red:   #f55f5f;
      --red-s: rgba(245,95,95,0.12);
      --red-b: rgba(245,95,95,0.25);

      --purple:   #a78bfa;
      --purple-s: rgba(167,139,250,0.12);
      --purple-b: rgba(167,139,250,0.25);

      --r: 8px; --rl: 14px;
      --f: 'DM Sans', sans-serif;
      --m: 'DM Mono', monospace;

      --shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--f);
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77,156,248,0.08), transparent);
      color: var(--t);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .app-wrapper { width: 100%; max-width: 1000px; }

    .app-label {
      font-size: 11px; font-weight: 500;
      color: var(--t3); letter-spacing: .6px;
      text-transform: uppercase; margin-bottom: 12px; padding-left: 2px;
      display: flex; align-items: center; gap: 8px;
    }
    .app-label::before {
      content: ''; width: 4px; height: 4px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
    }

    .app-shell {
      display: flex; flex-direction: column; height: 740px;
      border: 1px solid var(--b2);
      border-radius: var(--rl);
      overflow: hidden;
      background: var(--bg2);
      box-shadow: var(--shadow);
      animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

    /* ── TOPBAR ── */
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 18px;
      border-bottom: 1px solid var(--b);
      background: linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 100%);
      flex-shrink: 0;
    }
    .topbar-logo {
      display: flex; align-items: center; gap: 9px;
      font-size: 15px; font-weight: 700; color: var(--t); letter-spacing: -.3px;
      cursor: pointer;
    }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--blue-s), var(--green-s));
      border: 1px solid var(--blue-b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--blue);
      position: relative;
    }
    .logo-mark::after {
      content: '';
      position: absolute; top: 4px; right: 4px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .topbar-search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--bg4); border: 1px solid var(--b);
      border-radius: 99px; padding: 6px 16px;
      font-size: 13px; color: var(--t3); cursor: text;
      transition: all .2s; font-family: var(--f);
    }
    .topbar-search:hover { border-color: var(--b2); color: var(--t2); }

    .live-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600;
      padding: 4px 10px; border-radius: 99px;
      background: var(--green-s); color: var(--green);
      border: 1px solid var(--green-b); letter-spacing: .5px;
    }
    .live-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
      animation: blink 1.5s infinite;
    }
    .topbar-btn {
      width: 32px; height: 32px; border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      color: var(--t2); cursor: pointer; transition: all .15s;
      font-size: 17px; border: 1px solid var(--b); background: var(--bg4);
      position: relative;
    }
    .topbar-btn:hover { color: var(--t); border-color: var(--b2); background: var(--bg5); }
    .topbar-btn.has-notif::after {
      content: ''; position: absolute; top: 5px; right: 5px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); border: 1.5px solid var(--bg2);
      box-shadow: 0 0 6px var(--red);
    }
    .topbar-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--blue-s), var(--purple-s));
      border: 1px solid var(--blue-b);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--blue);
      cursor: pointer; font-family: var(--m); letter-spacing: .5px;
      transition: all .15s;
    }
    .topbar-avatar:hover { border-color: var(--blue); }

    .main-area { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 256px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--b);
      overflow-y: auto; background: var(--bg2);
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 99px; }

    .sidebar-section {
      padding: 12px 14px 6px;
      font-size: 9px; font-weight: 700; color: var(--t3);
      letter-spacing: 1.2px; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
    }
    .sidebar-section::after {
      content: ''; flex: 1; height: 1px; background: var(--b);
    }

    .route-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--b);
      cursor: pointer; transition: background .15s;
      position: relative;
    }
    .route-item::before {
      content: ''; position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 2.5px; border-radius: 99px;
      background: transparent; transition: background .2s;
    }
    .route-item:hover { background: var(--bg3); }
    .route-item.active { background: var(--bg3); }
    .route-item.active::before { background: var(--blue); }

    .route-badge {
      width: 36px; height: 36px; border-radius: var(--r);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
      border: 1px solid; font-family: var(--m); letter-spacing: .2px;
      transition: transform .15s;
    }
    .route-item:hover .route-badge { transform: scale(1.05); }
    .rb-green { background: var(--green-s); color: var(--green); border-color: var(--green-b); }
    .rb-blue  { background: var(--blue-s);  color: var(--blue);  border-color: var(--blue-b);  }
    .rb-amber { background: var(--amber-s); color: var(--amber); border-color: var(--amber-b); }
    .rb-coral { background: var(--red-s);   color: var(--red);   border-color: var(--red-b);   }

    .route-info { flex: 1; min-width: 0; }
    .route-name {
      font-size: 13px; font-weight: 500; color: var(--t);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .route-sub { font-size: 11px; color: var(--t2); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
    .sub-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

    .route-eta { text-align: right; }
    .eta-num { font-size: 15px; font-weight: 700; color: var(--t); font-family: var(--m); line-height: 1; }
    .eta-lbl { font-size: 9px; font-weight: 400; color: var(--t3); margin-top: 1px; letter-spacing: .3px; }

    .alert-item {
      padding: 10px 14px; border-bottom: 1px solid var(--b);
      display: flex; gap: 10px; align-items: flex-start;
      transition: background .15s; cursor: pointer;
    }
    .alert-item:hover { background: var(--bg3); }
    .alert-icon {
      width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 1px;
    }
    .ai-red   { background: var(--red-s);   color: var(--red);   border: 1px solid var(--red-b); }
    .ai-amber { background: var(--amber-s); color: var(--amber); border: 1px solid var(--amber-b); }
    .alert-title { font-size: 12px; font-weight: 600; color: var(--t); }
    .alert-sub { font-size: 11px; color: var(--t2); margin-top: 2px; line-height: 1.4; }
    .alert-time { font-size: 10px; color: var(--t3); margin-top: 3px; font-family: var(--m); }
    .empty-note { padding: 12px 14px; font-size: 11px; color: var(--t3); }

    /* ── MAP ── */
    .map-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .map-canvas {
      flex: 1; position: relative; overflow: hidden;
      background: #080c14;
      cursor: grab;
      min-height: 0;
    }
    .map-canvas.dragging { cursor: grabbing; }
    .map-svg {
      width: 100%; height: 100%;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Zoom hint */
    .map-hint {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: var(--t3); pointer-events: none;
      background: rgba(8,12,26,0.7); padding: 3px 10px; border-radius: 99px;
      white-space: nowrap;
      opacity: 1; transition: opacity .6s ease;
      z-index: 2;
    }
    .map-hint.fade { opacity: 0; }
    .map-reset-btn {
      position: absolute; bottom: 8px; right: 8px; z-index: 2;
      font-family: var(--f); font-size: 10px; color: var(--t2);
      background: rgba(8,12,26,0.7); border: 1px solid var(--b2);
      padding: 4px 10px; border-radius: 99px; cursor: pointer;
      transition: all .15s;
    }
    .map-reset-btn:hover { color: var(--t); border-color: rgba(77,156,248,0.4); background: rgba(8,12,26,0.9); }

    /* ── INFO PANEL ── */
    .info-panel {
      border-top: 1px solid var(--b);
      background: var(--bg3);
      padding: 10px 16px 12px;
      flex-shrink: 0; max-height: 160px; overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 13px;
    }
    .panel-title {
      font-size: 14px; font-weight: 600; color: var(--t);
      display: flex; align-items: center; gap: 8px; letter-spacing: -.2px;
    }
    .panel-tabs { display: flex; gap: 3px; background: var(--bg4); padding: 3px; border-radius: 99px; border: 1px solid var(--b); }
    .tab-btn {
      font-size: 11px; font-weight: 500;
      padding: 4px 13px; border-radius: 99px;
      border: none; cursor: pointer; color: var(--t2);
      background: transparent; transition: all .2s; font-family: var(--f);
    }
    .tab-btn:hover { color: var(--t); }
    .tab-btn.active { background: var(--bg5); color: var(--t); box-shadow: 0 1px 4px rgba(0,0,0,.3); }

    /* STOPS */
    .stops-row {
      display: flex; align-items: flex-start;
      overflow-x: auto; padding-bottom: 2px;
    }
    .stops-row::-webkit-scrollbar { height: 2px; }
    .stops-row::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 99px; }
    .stop-node {
      display: flex; flex-direction: column; align-items: center;
      min-width: 110px; cursor: pointer;
      transition: opacity .15s;
    }
    .stop-node:hover { opacity: .85; }
    .stop-dot-wrap { display: flex; align-items: center; width: 100%; }
    .stop-line { flex: 1; height: 2px; background: var(--b2); transition: background .3s; }
    .stop-line.passed { background: var(--green); }
    .stop-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--b2); background: var(--bg3);
      flex-shrink: 0; z-index: 1; transition: all .2s;
    }
    .stop-dot.passed { border-color: var(--green); background: var(--green); }
    .stop-dot.bus {
      width: 12px; height: 12px;
      border: 2.5px solid var(--blue); background: var(--blue);
      box-shadow: 0 0 0 5px var(--blue-s), 0 0 12px rgba(77,156,248,.4);
    }
    .stop-label { font-size: 10px; color: var(--t2); margin-top: 6px; text-align: center; max-width: 100px; line-height: 1.3; }
    .stop-label.current-label { color: var(--blue); font-weight: 600; }

    /* PRED CARDS */
    .pred-row { display: flex; gap: 10px; }
    .pred-card {
      flex: 1; background: var(--bg4); border-radius: var(--r);
      padding: 11px 14px; border: 1px solid var(--b);
      transition: border-color .2s, transform .2s;
      cursor: default;
    }
    .pred-card:hover { border-color: var(--b2); transform: translateY(-1px); }
    .pred-icon { font-size: 15px; margin-bottom: 5px; }
    .pred-label { font-size: 10px; color: var(--t3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .pred-value { font-size: 24px; font-weight: 700; color: var(--t); font-variant-numeric: tabular-nums; line-height: 1; }
    .pred-value span { font-size: 12px; font-weight: 400; color: var(--t2); margin-left: 1px; }
    .conf-bar-wrap { margin-top: 8px; height: 3px; background: var(--b2); border-radius: 99px; overflow: hidden; }
    .conf-bar { height: 100%; border-radius: 99px; background: var(--green); transition: width 1.2s cubic-bezier(.22,1,.36,1); }
    .conf-label { font-size: 10px; color: var(--t3); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
    .no-bus-note { font-size: 12px; color: var(--t2); padding: 10px 2px; }

    /* MODAL genérico (para crear ruta) */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(5,6,10,.65);z-index:50;align-items:center;justify-content:center;}
    .modal-backdrop.show{display:flex;}
    .modal-box{width:360px;max-width:92vw;background:var(--bg2);border:1px solid var(--b2);border-radius:var(--rl);box-shadow:var(--shadow);padding:18px 20px;}
    .modal-title{font-size:15px;font-weight:600;color:var(--t);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
    .modal-close{cursor:pointer;color:var(--t2);font-size:16px;background:none;border:none;}
    .modal-input{padding:8px 10px;background:var(--bg3);border:1px solid var(--b2);border-radius:var(--r);color:var(--t);font-family:var(--f);font-size:13px;width:100%;}

    /* Bus A12 glow pulse */
    @keyframes busGlow {
      0%,100% { opacity: .15; }
      50%      { opacity: .35; }
    }
    .bus-glow { animation: busGlow 2s ease-in-out infinite; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="app-label">LimaTrack · Vista de rutas · En vivo (datos de MySQL)</div>

  <div class="app-shell">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-logo" onclick="volverPanel()">
        <div class="logo-mark"><i class="ti ti-bus" style="font-size:14px"></i></div>
        LimaTrack
      </div>
      <div class="topbar-search">
        <i class="ti ti-search" style="font-size:13px;"></i>
        Busca una ruta o paradero…
      </div>
      <span class="live-badge">EN VIVO</span>
      <div class="topbar-btn" onclick="volverPanel()" title="Volver al panel"><i class="ti ti-arrow-left"></i></div>
      <div class="topbar-avatar" id="avatar" onclick="cerrarSesion()" title="Cerrar sesión">--</div>
    </div>

    <div class="main-area">

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="sidebar-section" style="display:flex;">
          <span>Mis rutas</span>
          <button onclick="abrirCrearRutaModal()" title="Agregar ruta" style="background:var(--bg4);border:1px solid var(--b2);color:var(--t2);border-radius:6px;width:18px;height:18px;cursor:pointer;font-size:12px;line-height:1;margin-left:6px;flex-shrink:0;">+</button>
        </div>
        <div id="listaRutas"></div>

        <div class="sidebar-section" style="margin-top:6px;">Alertas</div>
        <div id="listaAlertas"></div>
      </div>

      <!-- MAP + PANEL -->
      <div class="map-area">
        <div class="map-canvas" id="mapCanvas">
          <svg class="map-svg" viewBox="0 0 580 295" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="mapGlow" cx="40%" cy="70%" r="60%">
                <stop offset="0%" stop-color="#4d9cf8" stop-opacity="0.05"/>
                <stop offset="100%" stop-color="#0c0f1a" stop-opacity="0"/>
              </radialGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="glowSoft">
                <feGaussianBlur stdDeviation="1" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Fondo océano Pacífico -->
            <rect width="580" height="295" fill="#080c14"/>
            <!-- Tierra de Lima metropolitana -->
            <polygon points="0,295 0,60 18,52 35,48 52,50 65,46 78,40 95,38 115,35 138,32 162,30 188,35 210,38 232,36 255,40 275,45 295,44 315,40 340,38 365,42 390,48 415,52 440,55 465,58 490,62 510,65 535,68 555,72 575,78 580,82 580,295"
                  fill="#0e1220" stroke="none"/>
            <!-- Costa (línea) -->
            <polyline points="0,60 18,52 35,48 52,50 65,46 78,40 95,38 115,35 138,32 162,30 188,35 210,38 232,36 255,40 275,45 295,44 315,40 340,38 365,42 390,48 415,52 440,55 465,58 490,62 510,65 535,68 555,72 575,78 580,82"
                      fill="none" stroke="#1a2a4a" stroke-width="1.5"/>
            <!-- Efecto agua -->
            <polyline points="0,68 25,62 55,58 85,55 115,52 145,50 175,52 205,55 235,53 265,56 295,55 325,52 355,55 385,58 415,62 445,65 475,68 505,72 535,76 565,80 580,84"
                      fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.4" stroke-dasharray="4 6"/>
            <rect width="580" height="295" fill="url(#mapGlow)"/>

            <!-- ══ CALLES PRINCIPALES DE LIMA ══ -->
            <!-- Coordenadas mapeadas: Lima lat -12.27 a -11.85, lon -77.22 a -76.76 -->
            <!-- Escala: x = (lon+77.22)/0.46*580, y = (lat+11.85)/0.42*295 -->

            <!-- Panamericana Norte (vertical izq) -->
            <line x1="72" y1="0" x2="68" y2="295" stroke="#1c2238" stroke-width="5" stroke-linecap="round"/>
            <line x1="72" y1="0" x2="68" y2="295" stroke="#252d48" stroke-width="3" stroke-linecap="round"/>
            <text x="75" y="18" font-size="7" fill="#2e3a5a" font-family="sans-serif" font-weight="600" letter-spacing=".2">PANAMERICANA NORTE</text>

            <!-- Panamericana Sur (diagonal costanera) -->
            <line x1="120" y1="295" x2="245" y2="78" stroke="#1c2238" stroke-width="5" stroke-linecap="round"/>
            <line x1="120" y1="295" x2="245" y2="78" stroke="#252d48" stroke-width="3" stroke-linecap="round"/>
            <text x="130" y="262" font-size="6.5" fill="#2e3a5a" font-family="sans-serif" font-weight="600" transform="rotate(-52,130,262)">PAN. SUR</text>

            <!-- Av. Javier Prado (horizontal principal) -->
            <line x1="60" y1="148" x2="520" y2="135" stroke="#1e2640" stroke-width="7" stroke-linecap="round"/>
            <line x1="60" y1="148" x2="520" y2="135" stroke="#2a3355" stroke-width="4" stroke-linecap="round"/>
            <text x="90" y="143" font-size="7.5" fill="#3a4870" font-family="sans-serif" font-weight="600" letter-spacing=".3">AV. JAVIER PRADO</text>

            <!-- Av. La Marina -->
            <line x1="80" y1="108" x2="310" y2="100" stroke="#171d32" stroke-width="5"/>
            <line x1="80" y1="108" x2="310" y2="100" stroke="#202840" stroke-width="3"/>
            <text x="85" y="104" font-size="6.5" fill="#2e3a5a" font-family="sans-serif" font-weight="500" letter-spacing=".2">AV. LA MARINA</text>

            <!-- Av. Arequipa (vertical central) -->

<script>
let rutas = [];
let rutaSeleccionada = null;

function puenteJava() { return window.app; }

window.addEventListener('load', () => { esperarYcargar(); });

let intentos = 0;
function esperarYcargar() {
  intentos++;
  if (window.app) { cargarRutas(); return; }
  if (intentos > 100) { return; }
  setTimeout(esperarYcargar, 100);
}

function cargarRutas() {
  const sesion = JSON.parse(puenteJava().usuarioActualJson());
  if (!sesion.ok) { volverPanel(); return; }
  document.getElementById('avatar').textContent = sesion.usuario.iniciales;

  rutas = JSON.parse(puenteJava().listarRutas());
  renderListaRutas();
  renderAlertas();
  dibujarMapa();

  if (!rutaSeleccionada && rutas.length) {
    seleccionarRuta(rutas[0]);
  } else if (rutaSeleccionada) {
    const actualizada = rutas.find(r => r.idRuta === rutaSeleccionada.idRuta);
    if (actualizada) seleccionarRuta(actualizada); else resaltarRutaEnMapa();
  }
}

// ------------------------------------------------------------------
// MAPA DINÁMICO — dibuja una trayectoria distinta por cada ruta real,
// con buses que se mueven a velocidades distintas por ruta.
// ------------------------------------------------------------------
function hashCodigo(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function colorEstadoRuta(estado) {
  return { 'Normal': '#33d492', 'Demorada': '#f8b84d', 'Desvío': '#f55f5f' }[estado] || '#4d9cf8';
}

// ── Coordenadas reales de distritos de Lima en el SVG (viewBox 580x295) ──────
// Fórmula: x = (lon - (-77.22)) / 0.46 * 580   y = (lat - (-11.85)) / 0.42 * 295
// lon rango: -77.22 a -76.76    lat rango: -11.85 a -12.27
const GEO = {
  'callao':               { x: 78,  y: 82  },
  'san miguel':           { x: 110, y: 102 },
  'pueblo libre':         { x: 165, y: 112 },
  'jesus maria':          { x: 200, y: 120 },
  'lince':                { x: 228, y: 130 },
  'cercado de lima':      { x: 212, y: 110 },
  'rimac':                { x: 220, y: 96  },
  'brena':                { x: 188, y: 115 },
  'la victoria':          { x: 248, y: 128 },
  'san isidro':           { x: 272, y: 155 },
  'miraflores':           { x: 262, y: 182 },
  'san borja':            { x: 315, y: 168 },
  'surquillo':            { x: 282, y: 172 },
  'surco':                { x: 342, y: 198 },
  'barranco':             { x: 248, y: 215 },
  'chorrillos':           { x: 232, y: 248 },
  'san juan de miraflores':{ x: 215, y: 238 },
  'villa el salvador':    { x: 148, y: 268 },
  'villa maria del triunfo':{ x: 188, y: 258 },
  'ate':                  { x: 380, y: 148 },
  'la molina':            { x: 378, y: 185 },
  'santa anita':          { x: 345, y: 145 },
  'el agustino':          { x: 305, y: 130 },
  'san juan de lurigancho':{ x: 395, y: 92  },
  'independencia':        { x: 198, y: 55  },
  'los olivos':           { x: 155, y: 45  },
  'san martin de porres': { x: 130, y: 72  },
  'comas':                { x: 112, y: 32  },
  'carabayllo':           { x: 92,  y: 18  },
  'puente piedra':        { x: 68,  y: 22  },
  'lurin':                { x: 260, y: 288 },
  'chosica':              { x: 530, y: 115 },
  'lurigancho':           { x: 480, y: 98  },
};

function geoCoord(nombreLugar) {
  if (!nombreLugar) return null;
  const k = nombreLugar.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  if (GEO[k]) return GEO[k];
  for (const key in GEO) {
    if (k.includes(key) || key.includes(k)) return GEO[key];
  }
  return null;
}

function dibujarMapa() {
  const ns = 'http://www.w3.org/2000/svg';
  const capa = document.getElementById('capaRutas');
  capa.innerHTML = '';
  const lista = rutas.slice(0, 10);

  lista.forEach((r, i) => {
    // Obtener coordenadas reales de origen y destino en el SVG
    let p0 = geoCoord(r.origen);
    let p1 = geoCoord(r.destino);

    // Fallback: si no se reconoce el nombre, usar hash para posición aproximada
    if (!p0) {
      const h = hashCodigo(r.origen + i);
      p0 = { x: 68 + (h % 180), y: 30 + (h % 240) };
    }
    if (!p1) {
      const h = hashCodigo(r.destino + i);
      p1 = { x: 68 + (h % 180), y: 30 + (h % 240) };
    }

    // Punto de control bezier: desviación lateral natural
    const mx = (p0.x + p1.x) / 2;
    const my = (p0.y + p1.y) / 2;
    const dx = p1.x - p0.x;
    const dy = p1.y - p0.y;
    const perp = 18 * (i % 2 === 0 ? 1 : -1); // alternar lado
    const cpx = mx - dy * 0.15 + perp * 0.5;
    const cpy = my + dx * 0.15 - perp * 0.5;
    const d = `M${p0.x},${p0.y} Q${cpx},${cpy} ${p1.x},${p1.y}`;

    const color = colorEstadoRuta(r.estadoGeneral);
    const pathId = 'ruta-path-' + r.idRuta;
    const duracion = 8 + (i * 2); // velocidades distintas por ruta

    // Halo glow
    const glow = document.createElementNS(ns, 'path');
    glow.setAttribute('d', d);
    glow.setAttribute('fill', 'none');
    glow.setAttribute('stroke', color);
    glow.setAttribute('stroke-width', '6');
    glow.setAttribute('stroke-linecap', 'round');
    glow.setAttribute('opacity', '0.08');
    capa.appendChild(glow);

    // Línea de ruta
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('id', pathId);
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-dasharray', '7 4');
    path.setAttribute('opacity', '0.55');
    path.dataset.idRuta = r.idRuta;
    path.style.cursor = 'pointer';
    path.addEventListener('click', () => seleccionarRuta(r));
    capa.appendChild(path);

    // Puntos de origen y destino
    [[p0.x, p0.y], [p1.x, p1.y]].forEach(([x, y]) => {
      const ring = document.createElementNS(ns, 'circle');
      ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', '5');
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', color);
      ring.setAttribute('stroke-width', '1'); ring.setAttribute('opacity', '0.3');
      capa.appendChild(ring);
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', '3');
      c.setAttribute('fill', color); c.setAttribute('opacity', '0.9');
      capa.appendChild(c);
    });

    // Etiqueta origen
    const lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('x', p0.x + 5); lbl.setAttribute('y', p0.y - 5);
    lbl.setAttribute('font-size', '6.5'); lbl.setAttribute('fill', color);
    lbl.setAttribute('font-family', 'sans-serif'); lbl.setAttribute('font-weight', '700');
    lbl.textContent = r.codigo;
    capa.appendChild(lbl);

    // Bus animado sobre la ruta real
    const busG = document.createElementNS(ns, 'g');
    busG.setAttribute('id', 'ruta-bus-' + r.idRuta);
    busG.style.cursor = 'pointer';
    busG.addEventListener('click', () => seleccionarRuta(r));
    busG.innerHTML = `
      <rect x="-8" y="-5" width="16" height="10" rx="3" fill="${color}" opacity="0.95"/>
      <rect x="-8" y="-5" width="16" height="10" rx="3" fill="none" stroke="#08101a" stroke-width="0.8"/>
      <text x="-7" y="2.8" font-size="4.5" fill="#08101a" font-family="sans-serif" font-weight="800">${r.codigo}</text>
      <animateMotion dur="${duracion}s" repeatCount="indefinite" rotate="auto">
        <mpath href="#${pathId}"/>
      </animateMotion>`;
    capa.appendChild(busG);
  });

  resaltarRutaEnMapa();
}

function resaltarRutaEnMapa() {
  document.querySelectorAll('#capaRutas path[id^="ruta-path-"]').forEach(p => {
    const esSel = rutaSeleccionada && String(rutaSeleccionada.idRuta) === p.dataset.idRuta;
    p.setAttribute('stroke-width', esSel ? '3' : '1.6');
    p.setAttribute('opacity', esSel ? '1' : '0.35');
  });
  document.querySelectorAll('#capaRutas g[id^="ruta-bus-"]').forEach(g => {
    const idRuta = g.id.replace('ruta-bus-', '');
    const esSel = rutaSeleccionada && String(rutaSeleccionada.idRuta) === idRuta;
    g.style.opacity = esSel ? '1' : '0.4';
  });
}

function renderListaRutas() {
  const cont = document.getElementById('listaRutas');
  cont.innerHTML = '';
  const claseColor = { 'Normal':'rb-green', 'Demorada':'rb-amber', 'Desvío':'rb-coral' };
  const dotColor = { 'Normal':'var(--green)', 'Demorada':'var(--amber)', 'Desvío':'var(--red)' };

  rutas.forEach(r => {
    const div = document.createElement('div');
    div.className = 'route-item' + (rutaSeleccionada && rutaSeleccionada.idRuta === r.idRuta ? ' active' : '');
    div.innerHTML = `
      <div class="route-badge ${claseColor[r.estadoGeneral] || 'rb-blue'}">${r.codigo}</div>
      <div class="route-info">
        <div class="route-name">${r.origen} → ${r.destino}</div>
        <div class="route-sub"><span class="sub-dot" style="background:${dotColor[r.estadoGeneral]||'var(--blue)'};box-shadow:0 0 5px ${dotColor[r.estadoGeneral]||'var(--blue)'}"></span>${r.totalBuses} ${r.totalBuses===1?'bus':'buses'}</div>
      </div>
      <div class="route-eta"><div class="eta-num">${r.cumplimientoPct}</div><div class="eta-lbl">% CUMPL.</div></div>`;
    div.onclick = () => seleccionarRuta(r);
    cont.appendChild(div);
  });
}

function renderAlertas() {
  const cont = document.getElementById('listaAlertas');
  cont.innerHTML = '';
  let alertas = [];
  try { alertas = JSON.parse(puenteJava().listarAlertasPendientes()); } catch (e) {}
  if (!alertas.length) {
    cont.innerHTML = '<div class="empty-note">Sin alertas pendientes ✔</div>';
    return;
  }
  alertas.slice(0, 4).forEach(a => {
    const div = document.createElement('div');
    div.className = 'alert-item';
    const icono = a.severidad === 'ALTA' ? 'ai-red' : 'ai-amber';
    div.innerHTML = `
      <div class="alert-icon ${icono}"><i class="ti ti-alert-triangle"></i></div>
      <div>

  });
}

  document.getElementById('mapCardStripe').setAttribute('fill', color);
  document.getElementById('mapCardRuta').setAttribute('fill', color);

  document.getElementById('modalBackdrop').classList.add('show');
}

function abrirCrearRutaModal() {
  const html = `
    <div style="display:flex;flex-direction:column;gap:8px;">
      <input id="nr-codigo" class="modal-input" placeholder="Código (ej. L13)">
      <input id="nr-origen" class="modal-input" placeholder="Origen (ej. Miraflores)">
      <input id="nr-destino" class="modal-input" placeholder="Destino (ej. San Isidro)">
      <div style="display:flex;gap:8px;">
        <input id="nr-distancia" type="number" step="0.1" class="modal-input" placeholder="Km" value="15">
        <input id="nr-tiempo" type="number" class="modal-input" placeholder="Min" value="40">
        <input id="nr-tarifa" type="number" step="0.10" class="modal-input" placeholder="S/" value="2.50">
      </div>
      <div id="nr-error" style="display:none;color:var(--red);font-size:11px;"></div>
      <button class="tab-btn active" style="padding:8px;margin-top:4px;" onclick="guardarRutaNuevaDesdeRutas()">Guardar ruta</button>
    </div>`;
  abrirModal('Agregar ruta nueva', html);
}

function guardarRutaNuevaDesdeRutas() {
  const codigo = document.getElementById('nr-codigo').value.trim();
  const origen = document.getElementById('nr-origen').value.trim();
  const destino = document.getElementById('nr-destino').value.trim();
  const distancia = parseFloat(document.getElementById('nr-distancia').value) || 10;
  const tiempo = parseInt(document.getElementById('nr-tiempo').value, 10) || 30;
  const tarifa = parseFloat(document.getElementById('nr-tarifa').value) || 2.5;
  const errEl = document.getElementById('nr-error');

  if (!codigo || !origen || !destino) {
    errEl.textContent = 'El código, origen y destino son obligatorios.';
    errEl.style.display = 'block';
    return;
  }

  const respuesta = JSON.parse(puenteJava().crearRuta(codigo, '', origen, destino, distancia, tiempo, tarifa));
  if (respuesta.ok) {
    cerrarModal();
    cargarRutas();
  } else {
    errEl.textContent = respuesta.mensaje || 'No se pudo guardar la ruta.';
    errEl.style.display = 'block';
  }
}

setInterval(cargarRutas, 15000);

// ══════════════════════════════════════════════════════════════
// MAPA: PAN (arrastre) + ZOOM (rueda del mouse)
// Mueve el viewBox del SVG para simular cámara sobre el mapa
// ══════════════════════════════════════════════════════════════
(function() {
  const FULL_W = 580, FULL_H = 295;   // tamaño original del mapa
  const MIN_ZOOM = 1.0, MAX_ZOOM = 5.0;
  const START_ZOOM = 1.6;              // arranca ya "acercado" para que arrastrar sirva desde el inicio
  const START_CX = 300, START_CY = 150; // centro inicial aprox. (Lince / San Isidro)

  let zoom = START_ZOOM;
  let panX = 0, panY = 0;             // offset en coordenadas del SVG
  let dragging = false;
  let lastMX = 0, lastMY = 0;
  let dragMoved = false;

  const canvas  = document.getElementById('mapCanvas');
  const svg     = canvas ? canvas.querySelector('.map-svg') : null;
  const hint    = document.querySelector('.map-hint');

  if (!svg) return;

  let hintTimer = setTimeout(() => hint && hint.classList.add('fade'), 4500);
  function dismissHint() {
    if (!hint) return;
    hint.classList.add('fade');
    clearTimeout(hintTimer);
  }

  function clampPan() {
    const visW = FULL_W / zoom;
    const visH = FULL_H / zoom;
    panX = Math.max(0, Math.min(panX, FULL_W - visW));
    panY = Math.max(0, Math.min(panY, FULL_H - visH));
  }

  function applyView() {
    const visW = FULL_W / zoom;
    const visH = FULL_H / zoom;
    svg.setAttribute('viewBox', `${panX} ${panY} ${visW} ${visH}`);
  }

  // ── Mouse drag ────────────────────────────────────────────
  canvas.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    dragging = true;
    dragMoved = false;
    lastMX = e.clientX;
    lastMY = e.clientY;
    canvas.classList.add('dragging');
    e.preventDefault();
  });

  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = (FULL_W / zoom) / rect.width;
    const scaleY = (FULL_H / zoom) / rect.height;
    panX -= (e.clientX - lastMX) * scaleX;
    panY -= (e.clientY - lastMY) * scaleY;
    lastMX = e.clientX;
    lastMY = e.clientY;
    if (!dragMoved) { dragMoved = true; dismissHint(); }
    clampPan();
    applyView();
  });

  window.addEventListener('mouseup', function() {
    dragging = false;
    canvas.classList.remove('dragging');
  });

  // ── Rueda del mouse: zoom centrado en el cursor ───────────
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    dismissHint();
    const rect = canvas.getBoundingClientRect();

    // Posición del cursor en coordenadas SVG ANTES del zoom
    const visW = FULL_W / zoom;
    const visH = FULL_H / zoom;
    const svgX = panX + (e.clientX - rect.left) / rect.width  * visW;
    const svgY = panY + (e.clientY - rect.top)  / rect.height * visH;

    // Aplicar zoom
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));

    // Recentrar en el punto bajo el cursor
    const newVisW = FULL_W / zoom;
    const newVisH = FULL_H / zoom;
    panX = svgX - (e.clientX - rect.left) / rect.width  * newVisW;
    panY = svgY - (e.clientY - rect.top)  / rect.height * newVisH;

    clampPan();
    applyView();
  }, { passive: false });

  // ── Doble clic: reset zoom ────────────────────────────────
  canvas.addEventListener('dblclick', function() {
    zoom = START_ZOOM;
    panX = START_CX - (FULL_W / zoom) / 2;
    panY = START_CY - (FULL_H / zoom) / 2;
    clampPan();
    applyView();
  });

  // ── Botón "Toda Lima": vuelve al zoom mínimo (mapa completo) ──
  const resetBtn = document.getElementById('mapResetBtn');
  if (resetBtn) {
    resetBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      zoom = MIN_ZOOM; panX = 0; panY = 0;
      applyView();
    });
  }

  // Inicializar viewBox centrado en START_CX/START_CY con el zoom inicial
  panX = START_CX - (FULL_W / zoom) / 2;
  panY = START_CY - (FULL_H / zoom) / 2;
  clampPan();
  applyView();
})();
</script>
